<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>듀온 프로필 카드 생성기</title>
<style>
  :root{
    --ink:#2C2C2A;
    --ink-soft:#5F5E5A;
    --ink-faint:#9B9A93;
    --line:#E4E1D8;
    --paper:#FAF9F5;
    --rose:#993556;
    --rose-soft:#FBEAF0;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .backbar{margin-bottom:18px}
  .backbar a{color:var(--rose);text-decoration:none;font-size:14px;font-weight:600}
  header{margin-bottom:28px}
  h1{font-size:22px;font-weight:600;margin:0 0 6px}
  header p{margin:0;color:var(--ink-soft);font-size:14px}
  .grid{display:grid;grid-template-columns:1fr;gap:28px}
  @media(min-width:820px){.grid{grid-template-columns:400px 1fr;align-items:start}}
  .preview{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;position:sticky;top:20px}
  canvas{width:100%;display:block;border-radius:10px}
  fieldset{border:1px solid var(--line);border-radius:14px;background:#fff;padding:18px;margin:0 0 16px}
  legend{font-size:13px;color:var(--ink-soft);padding:0 6px}
  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px}
  input[type=text],select{
    width:100%;height:40px;padding:0 12px;font-size:15px;font-family:inherit;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  input[type=text]:focus,select:focus{outline:none;border-color:var(--rose)}
  input[type=file]{font-size:13px;width:100%}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  button{
    height:42px;padding:0 18px;font-size:15px;font-family:inherit;cursor:pointer;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  }
  button:hover{border-color:var(--ink-faint)}
  button.primary{background:var(--rose);border-color:var(--rose);color:#fff;width:100%}
  .count{float:right;font-size:13px;color:var(--ink-faint)}
  .err{color:#A32D2D;font-size:13px;margin:8px 0 0;display:none}
  .hint{font-size:13px;color:var(--ink-faint);margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="backbar"><a href="{{ url_for('admin_list') }}">← 회원 관리로</a></div>
  <header>
    <h1>듀온 프로필 카드 생성기</h1>
    <p>정보를 채우면 공유용 카드가 실시간으로 그려집니다. 저장한 이미지를 그대로 보내세요.</p>
  </header>

  <div class="grid">
    <div class="preview"><canvas id="cv"></canvas></div>

    <div>
      <fieldset>
        <legend>사진</legend>
        <div class="field">
          <label>프로필 사진 <span class="count" id="pcount">0 / 5</span></label>
          <input type="file" id="photos" accept="image/*" multiple />
          <p class="hint">첫 장이 메인, 나머지는 아래 썸네일로 들어갑니다.</p>
        </div>
        <div class="field"><button id="clear">사진 비우기</button></div>
        <div class="field">
          <label>로고 파일 (비우면 기본 로고)</label>
          <input type="file" id="logo" accept="image/*" />
        </div>
      </fieldset>

      <fieldset>
        <legend>기본 정보</legend>
        <div class="row">
          <div class="field"><label for="nm">이름</label><input type="text" id="nm" placeholder="지민" /></div>
          <div class="field"><label for="ag">나이</label><input type="text" id="ag" placeholder="29" /></div>
          <div class="field"><label for="mb">MBTI</label><input type="text" id="mb" maxlength="4" placeholder="ENFP" style="text-transform:uppercase" /></div>
          <div class="field"><label for="ht">키 (cm)</label><input type="text" id="ht" placeholder="178" /></div>
          <div class="field"><label for="rg">지역</label><input type="text" id="rg" placeholder="서울 강남" /></div>
          <div class="field"><label for="jb">직업</label><input type="text" id="jb" placeholder="디자이너" /></div>
        </div>
        <div class="field">
          <label for="rl">종교</label>
          <select id="rl">
            <option value="">표시 안 함</option>
            <option>무교</option><option>기독교</option><option>천주교</option>
            <option>불교</option><option>원불교</option><option>기타</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>소개</legend>
        <div class="field"><label for="bi">한 줄 소개</label><input type="text" id="bi" placeholder="주말엔 등산, 평일엔 넷플릭스" /></div>
        <div class="field"><label for="tg">태그 (쉼표로 구분)</label><input type="text" id="tg" placeholder="강아지파, 술 조금, 집순이" /></div>
      </fieldset>

      <button class="primary" id="save">이미지 저장</button>
      <p class="err" id="err">이름을 먼저 입력하세요</p>
    </div>
  </div>
</div>

<script>
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = 800, H = 1120;
  cv.width = W; cv.height = H;

  var photos = [];
  var logo = null;
  var textIds = ['nm','ag','mb','ht','rg','jb','bi','tg'];

  function val(id){ return document.getElementById(id).value.trim(); }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawCover(im,x,y,w,h,r){
    ctx.save();
    roundRect(x,y,w,h,r);
    ctx.clip();
    var s = Math.max(w/im.width, h/im.height);
    var iw = im.width*s, ih = im.height*s;
    ctx.drawImage(im, x+(w-iw)/2, y+(h-ih)/2, iw, ih);
    ctx.restore();
  }

  function wrapText(text,x,y,maxWidth,lineHeight,maxLines){
    var words = text.split(' '), line = '', lines = 0;
    for (var i=0;i<words.length;i++){
      var test = line ? line+' '+words[i] : words[i];
      if (ctx.measureText(test).width > maxWidth && line){
        ctx.fillText(line,x,y);
        y += lineHeight; lines++; line = words[i];
        if (lines >= maxLines) return y;
      } else {
        line = test;
      }
    }
    ctx.fillText(line,x,y);
    return y + lineHeight;
  }

  function drawFooter(){
    ctx.fillStyle = '#F1EFE8';
    ctx.fillRect(48,1026,704,1);
    if (logo){
      var h = 46, w = logo.width*(46/logo.height);
      if (w > 260){ w = 260; h = logo.height*(260/logo.width); }
      ctx.drawImage(logo,48,1078-h,w,h);
      return;
    }
    ctx.fillStyle = '#ED93B1';
    ctx.beginPath(); ctx.arc(64,1058,17,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#993556';
    ctx.beginPath(); ctx.arc(88,1058,17,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FBEAF0';
    ctx.beginPath(); ctx.arc(76,1058,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2C2C2A';
    ctx.font = '600 30px sans-serif';
    ctx.fillText('듀온',118,1068);
    ctx.fillStyle = '#B4B2A9';
    ctx.font = '400 22px sans-serif';
    ctx.fillText('duon',180,1068);
  }

  function draw(){
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0,0,W,H);

    var n = photos.length;
    var mainH = n > 1 ? 430 : 540;

    if (n > 0){
      drawCover(photos[0],40,40,720,mainH,24);
    } else {
      ctx.save();
      roundRect(40,40,720,mainH,24); ctx.clip();
      ctx.fillStyle = '#F1EFE8'; ctx.fillRect(40,40,720,mainH);
      ctx.fillStyle = '#B4B2A9'; ctx.font = '400 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('사진을 올려주세요',400,40+mainH/2);
      ctx.textAlign = 'left';
      ctx.restore();
    }

    var y = 40 + mainH;

    if (n > 1){
      var k = n-1;
      var tw = (720 - (k-1)*10)/k;
      var th = k >= 4 ? 128 : 146;
      for (var i=0;i<k;i++){
        drawCover(photos[i+1], 40+i*(tw+10), y+12, tw, th, 12);
      }
      y += 12 + th;
    }

    y += 62;

    var name = val('nm') || '이름';
    var age = val('ag');
    var mbti = val('mb').toUpperCase();

    ctx.fillStyle = '#2C2C2A';
    ctx.font = '600 50px sans-serif';
    ctx.fillText(name,48,y);
    var cx = 48 + ctx.measureText(name).width + 16;

    if (age){
      ctx.fillStyle = '#888780';
      ctx.font = '400 34px sans-serif';
      ctx.fillText(age,cx,y);
      cx += ctx.measureText(age).width + 16;
    }

    if (mbti){
      ctx.font = '600 24px sans-serif';
      var mw = ctx.measureText(mbti).width + 34;
      ctx.fillStyle = '#EEEDFE';
      roundRect(cx,y-30,mw,42,21); ctx.fill();
      ctx.fillStyle = '#3C3489';
      ctx.fillText(mbti,cx+17,y-2);
    }

    var height = val('ht');
    var religion = document.getElementById('rl').value;
    var meta = [val('rg'), val('jb'), height ? height+'cm' : '', religion]
      .filter(Boolean).join('  ·  ');

    y += 50;
    if (meta){
      ctx.fillStyle = '#5F5E5A';
      ctx.font = '400 28px sans-serif';
      y = wrapText(meta,48,y,704,42,2) + 12;
    }

    var bio = val('bi');
    if (bio){
      ctx.fillStyle = '#2C2C2A';
      ctx.font = '400 30px sans-serif';
      y = wrapText(bio,48,y,704,44,2) + 8;
    }

    var tags = val('tg').split(',').map(function(s){return s.trim();}).filter(Boolean);
    var tx = 48, ty = y;
    ctx.font = '400 24px sans-serif';
    for (var j=0;j<tags.length;j++){
      var pw = ctx.measureText(tags[j]).width + 40;
      if (tx + pw > 752){ tx = 48; ty += 54; }
      ctx.fillStyle = '#FBEAF0';
      roundRect(tx,ty,pw,44,22); ctx.fill();
      ctx.fillStyle = '#993556';
      ctx.fillText(tags[j],tx+20,ty+30);
      tx += pw + 10;
    }

    drawFooter();
  }

  function loadImage(file,cb){
    var reader = new FileReader();
    reader.onload = function(){
      var im = new Image();
      im.onload = function(){ cb(im); };
      im.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  textIds.forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      document.getElementById('err').style.display = 'none';
      draw();
    });
  });

  document.getElementById('rl').addEventListener('change', draw);

  document.getElementById('photos').addEventListener('change', function(e){
    var files = Array.prototype.slice.call(e.target.files);
    files.forEach(function(f){
      if (photos.length >= 5) return;
      var slot = photos.length;
      photos.push(null);
      loadImage(f, function(im){
        photos[slot] = im;
        if (photos.every(Boolean)){
          document.getElementById('pcount').textContent = photos.length + ' / 5';
          draw();
        }
      });
    });
  });

  document.getElementById('logo').addEventListener('change', function(e){
    var f = e.target.files[0];
    if (!f) return;
    loadImage(f, function(im){ logo = im; draw(); });
  });

  document.getElementById('clear').addEventListener('click', function(){
    photos = [];
    document.getElementById('photos').value = '';
    document.getElementById('pcount').textContent = '0 / 5';
    draw();
  });

  document.getElementById('save').addEventListener('click', function(){
    if (!val('nm')){
      document.getElementById('err').style.display = 'block';
      return;
    }
    var a = document.createElement('a');
    a.download = val('nm') + '_duon.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  });

  draw();
})();
</script>
</body>
</html>
