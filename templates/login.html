{% extends "base.html" %}
{% block title %}로그인 · 듀온{% endblock %}
{% block content %}
<div class="form-card">
  <h2>다시 만나서 반가워요</h2>
  <form method="post" class="stack">
    <label>이메일
      <input type="email" name="email" required>
    </label>
    <label>비밀번호
      <input type="password" name="password" required>
    </label>
    <button class="btn btn-lg" type="submit">로그인</button>
  </form>
  <p class="muted center">아직 계정이 없나요? <a href="{{ url_for('register') }}">회원가입</a></p>
</div>
{% endblock %}
