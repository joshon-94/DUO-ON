{% extends "base.html" %}
{% block title %}로그인 · 듀온{% endblock %}
{% block content %}
<div class="auth-wrap">
  <aside class="auth-aside">
    <div class="auth-blob auth-blob-1"></div>
    <div class="auth-blob auth-blob-2"></div>
    <div class="auth-aside-inner">
      <span class="auth-logo">듀온<span>.</span></span>
      <h2>가치관으로<br>만나는 인연</h2>
      <p>외모가 아닌 생각과 취향이 통하는 사람을 추천해 드려요.</p>
      <ul class="auth-points">
        <li>가치관·취향 매칭률 분석</li>
        <li>나와 잘 맞는 순서로 추천</li>
        <li>서로 좋아요하면 매칭 성사</li>
      </ul>
    </div>
  </aside>

  <section class="auth-form">
    <h2>다시 만나서 반가워요</h2>
    <p class="muted">로그인하고 오늘의 추천을 확인해 보세요.</p>
    <form method="post" class="stack">
      <label>이메일
        <input type="email" name="email" placeholder="you@example.com" required>
      </label>
      <label>비밀번호
        <input type="password" name="password" placeholder="비밀번호" required>
      </label>
      <button class="btn btn-lg" type="submit">로그인</button>
    </form>
    <p class="muted center">아직 계정이 없나요? <a href="{{ url_for('register') }}">회원가입</a></p>
  </section>
</div>
{% endblock %}
