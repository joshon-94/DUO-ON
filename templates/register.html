{% extends "base.html" %}
{% block title %}회원가입 · 듀온{% endblock %}
{% block content %}
<div class="form-card">
  <h2>듀온 시작하기</h2>
  <p class="muted">기본 정보를 입력하면 가치관·취향 설문으로 이어져요.</p>
  <form method="post" class="stack">
    <label>이메일
      <input type="email" name="email" value="{{ form.email or '' }}" required>
    </label>
    <label>비밀번호
      <input type="password" name="password" required minlength="4">
    </label>
    <label>이름 / 닉네임
      <input type="text" name="name" value="{{ form.name or '' }}" required>
    </label>
    <label>성별
      <div class="radio-row">
        <label class="radio"><input type="radio" name="gender" value="M" {{ 'checked' if form.gender=='M' }} required> 남성</label>
        <label class="radio"><input type="radio" name="gender" value="F" {{ 'checked' if form.gender=='F' }}> 여성</label>
      </div>
    </label>
    <label>출생연도
      <input type="number" name="birth_year" min="1950" max="2010" placeholder="예: 1995" value="{{ form.birth_year or '' }}" required>
    </label>
    <label>거주 지역 (선택)
      <input type="text" name="location" value="{{ form.location or '' }}" placeholder="예: 서울 강남구">
    </label>
    <button class="btn btn-lg" type="submit">다음 단계로</button>
  </form>
  <p class="muted center">이미 계정이 있나요? <a href="{{ url_for('login') }}">로그인</a></p>
</div>
{% endblock %}
