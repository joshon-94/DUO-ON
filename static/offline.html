<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오프라인 · 듀온</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#f6f1e8; color:#221d18; font-family:"Noto Sans KR",system-ui,sans-serif; text-align:center; padding:24px; }
    .wrap { max-width:340px; }
    .mark { font-size:44px; margin-bottom:14px; }
    h1 { font-family:"Cormorant Garamond",serif; font-size:28px; margin:0 0 10px; }
    p { color:#6a6157; line-height:1.7; margin:0 0 22px; }
    a { display:inline-block; background:#221d18; color:#fff; text-decoration:none;
      padding:13px 26px; border-radius:8px; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">💛</div>
    <h1>인터넷 연결이 끊겼어요</h1>
    <p>네트워크가 다시 연결되면 듀온을 이용할 수 있어요.<br>잠시 후 다시 시도해 주세요.</p>
    <a href="/" onclick="location.reload();return false;">다시 시도</a>
  </div>
</body>
</html>
